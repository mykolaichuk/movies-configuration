---
# Static inventory with values from Terraform outputs (extra vars), not
# copied by hand. One app VM; the play for the database runs on the
# implicit localhost, i.e. the agent itself.
all:
  children:
    app:
      hosts:
        movies-app:
          ansible_host: "{{ app_vm.private_ip }}"
          ansible_user: "{{ app_vm.admin_user }}"
