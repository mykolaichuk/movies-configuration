---
# The repository key is pinned to this one source (signed-by), not trusted
# for every repository on the machine.
- name: Add the NodeSource repository
  ansible.builtin.deb822_repository:
    name: nodesource
    types: [deb]
    uris: "https://deb.nodesource.com/node_{{ nodejs_major }}.x"
    suites: [nodistro]
    components: [main]
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present
  register: nodejs_repo

# Ubuntu ships an older 'nodejs' too; the pin makes the choice explicit.
- name: Prefer NodeSource for the nodejs package
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/nodesource
    content: |
      # Managed by Ansible (movies-configuration/roles/nodejs)
      Package: nodejs
      Pin: origin deb.nodesource.com
      Pin-Priority: 600
    owner: root
    group: root
    mode: "0644"

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: "{{ nodejs_repo is changed }}"
