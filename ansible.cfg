[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False
nocows = True

[ssh_connection]
# accept-new: trust the host key on first contact (TOFU), refuse it if it
# ever changes. After the VM is replaced, run the pipeline once with
# "Forget the app VM SSH host key" ticked (pipelines/README.md).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes
pipelining = True
